name: Meal Share checks

on:
  pull_request:
    paths:
      - 'meal_share/**'
      - '.github/workflows/meal-share-checks.yml'
  push:
    branches: [main]
    paths:
      - 'meal_share/**'
      - '.github/workflows/meal-share-checks.yml'

permissions:
  contents: read

concurrency:
  group: meal-share-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      REACT_APP_GOOGLE_MAPS_API_KEY: ''
      REACT_APP_API_BASE_URL: ''
      GOOGLE_MAPS_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: meal_share/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: meal_share/backend/requirements*.txt
      - name: Install backend and browser test dependencies
        run: python -m pip install -r meal_share/backend/requirements.txt -r meal_share/backend/requirements-test.txt
      - name: Check account and meal authorization with synthetic records
        run: python -m unittest discover -s meal_share/backend/tests -p 'test_*.py' -v
      - name: Install frontend from lockfile
        working-directory: meal_share/frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Test frontend navigation
        working-directory: meal_share/frontend
        run: npm test -- --watch=false --runInBand
      - name: Build frontend
        working-directory: meal_share/frontend
        run: npm run build
      - name: Install Chromium for fixture checks
        run: python -m playwright install --with-deps chromium
      - name: Exercise built UI against the local fixture API
        run: python meal_share/backend/tests/browser_accounts.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: meal-share-browser-checks
          path: meal_share/browser-results/
          retention-days: 3
          if-no-files-found: error
